---
- name: Configurar Bastión
  hosts: bastion
  become: yes
  tasks:
    - name: Activar forwarding IP
      sysctl:
        name: net.ipv4.ip_forward
        value: '1'
        sysctl_set: yes
        state: present
        reload: yes

    - name: Configurar NAT para red de clientes
      iptables:
        table: nat
        chain: POSTROUTING
        source: 172.16.1.0/24
        out_interface: ens18
        jump: MASQUERADE
        comment: "NAT para clientes"